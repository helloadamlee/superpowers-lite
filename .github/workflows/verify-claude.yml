name: Verify Claude Code plugin

on:
  push:
  pull_request:

jobs:
  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Verify plugin and marketplace
        run: sh claude/scripts/verify-claude-plugin.sh
      - name: Visual companion server tests
        working-directory: claude/tests/brainstorm-server
        run: |
          npm ci
          npm test
